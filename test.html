<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flashcard App Test</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      .status {
        padding: 10px;
        margin: 10px 0;
        border-radius: 5px;
      }
      .success {
        background-color: #d4edda;
        color: #155724;
      }
      .error {
        background-color: #f8d7da;
        color: #721c24;
      }
      .info {
        background-color: #d1ecf1;
        color: #0c5460;
      }
    </style>
  </head>
  <body>
    <h1>Flashcard App Test</h1>
    <div id="test-results"></div>

    <script>
      async function runTests() {
        const results = document.getElementById("test-results");

        function addResult(message, type = "info") {
          const div = document.createElement("div");
          div.className = "status " + type;
          div.textContent = message;
          results.appendChild(div);
        }

        addResult("Starting tests...", "info");

        // Test 1: Check if JSON files exist
        try {
          const response = await fetch("A1.json");
          if (response.ok) {
            const data = await response.json();
            addResult(
              `✓ A1.json loaded successfully (${data.length} words)`,
              "success"
            );
          } else {
            addResult("✗ Failed to load A1.json", "error");
          }
        } catch (error) {
          addResult(`✗ Error loading A1.json: ${error.message}`, "error");
        }

        // Test 2: Check if app.js loads
        try {
          const response = await fetch("app.js");
          if (response.ok) {
            addResult("✓ app.js loads successfully", "success");
          } else {
            addResult("✗ Failed to load app.js", "error");
          }
        } catch (error) {
          addResult(`✗ Error loading app.js: ${error.message}`, "error");
        }

        // Test 3: Check external API connectivity (MyMemory)
        try {
          const response = await fetch(
            "https://api.mymemory.translated.net/get?q=hello&langpair=en|ar",
            {
              mode: "cors",
            }
          );
          if (response.ok) {
            addResult("✓ MyMemory API is accessible", "success");
          } else {
            addResult("✗ MyMemory API is not accessible", "error");
          }
        } catch (error) {
          addResult(`✗ MyMemory API error: ${error.message}`, "error");
        }

        addResult("Tests completed!", "info");
      }

      runTests();
    </script>
  </body>
</html>
